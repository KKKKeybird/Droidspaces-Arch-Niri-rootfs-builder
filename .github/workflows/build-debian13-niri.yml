name: Build Debian 13 ARM64 Niri + Noctalia RootFS
on:
  workflow_dispatch:
    inputs:
      username:
        description: Linux username
        type: string
        default: colle
      ghostty:
        description: Compile Ghostty 1.3.1 on ARM64
        type: boolean
        default: true
      rime:
        description: Install Fcitx5 Rime Ice
        type: boolean
        default: true
      publish_release:
        description: Publish GitHub Release (otherwise Actions artifact only)
        type: boolean
        default: false
  push:
    branches: [debian13-niri]
    paths: ['debian13/**', '.github/workflows/build-debian13-niri.yml', 'scripts/niri/**', 'scripts/terminal/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout Debian overlay fork
        uses: actions/checkout@v4
        with:
          path: fork
      - name: Checkout pinned upstream Debian 13 Droidspaces builder
        uses: actions/checkout@v4
        with:
          repository: Goldzxcbug/Droidspaces-rootfs-Desktop-builder
          ref: 24189f46b4608d312f654d9f53a48e25a214001c
          path: upstream
          persist-credentials: false
      - name: Check scripts and hardware architecture
        run: |
          uname -m
          test "$(uname -m)" = aarch64
          bash -n fork/debian13/scripts/*.sh
          test -f upstream/Debian-13.Dockerfile
      - name: Build upstream Debian 13 + patched Anland Niri base
        run: |
          docker build --progress=plain --platform linux/arm64 \
            -f upstream/Debian-13.Dockerfile --target customizer \
            --build-arg USERNAME="${{ inputs.username || 'colle' }}" \
            --build-arg DESKTOP=niri \
            --build-arg DESKTOP_AUTOSTART=true \
            --build-arg DISPLAY_BACKEND=anland-wayland \
            --build-arg PulseAudio=none \
            --build-arg ENABLE_zh_tz_ARG=true \
            --build-arg ENABLE_binfmt_ARG=false \
            --build-arg ENABLE_yj_ARG=false \
            --build-arg ENABLE_mesa_ARG=true \
            --build-arg ENABLE_kfgj_ARG=false \
            --build-arg ENABLE_zip_ARG=true \
            --build-arg ENABLE_docker_ARG=false \
            --build-arg ENABLE_srf_ARG=true \
            --build-arg ENABLE_8gen2_wayland_ARG=false \
            --build-arg ENABLE_systemd257_ARG=false \
            -t droidspaces-debian13-niri:base upstream
      - name: Build full Debian 13 overlay and export rootfs
        run: |
          mkdir -p out/rootfs
          docker buildx build --progress=plain --platform linux/arm64 \
            -f fork/debian13/Dockerfile --target export \
            --build-arg BASE_IMAGE=droidspaces-debian13-niri:base \
            --build-arg USERNAME="${{ inputs.username || 'colle' }}" \
            --build-arg ENABLE_GHOSTTY="${{ github.event_name == 'push' && 'true' || (inputs.ghostty && 'true' || 'false') }}" \
            --build-arg ENABLE_RIME="${{ github.event_name == 'push' && 'true' || (inputs.rime && 'true' || 'false') }}" \
            --output type=local,dest=out/rootfs fork
          sudo tar --numeric-owner --xattrs -C out/rootfs -cJf \
            out/droidspaces-debian13-niri-arm64.tar.xz .
          sha256sum out/droidspaces-debian13-niri-arm64.tar.xz > out/SHA256SUMS
      - name: Upload rootfs to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-debian13-niri-arm64
          path: |
            out/*.tar.xz
            out/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
      - name: Create release on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debian13-niri-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.tar.xz out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Debian 13 Niri ARM64 ${GITHUB_RUN_NUMBER}" \
            --notes "Experimental Droidspaces Debian 13 ARM64 Niri + Noctalia. Test on Android 4.19 before daily use."
