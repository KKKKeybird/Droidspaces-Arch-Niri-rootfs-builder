name: Build Debian 13 ARM64 Niri + Noctalia RootFS
on:
  workflow_dispatch:
    inputs:
      username:
        description: Linux username
        type: string
        default: colle
      ghostty:
        description: Install latest verified Ghostty Debian 13 ARM64 package
        type: boolean
        default: true
      rime:
        description: Install Fcitx5 Rime Ice
        type: boolean
        default: true
      publish_release:
        description: Publish GitHub Release (otherwise Actions artifact only)
        type: boolean
        default: false
  push:
    branches: [debian13-niri]
    paths: ['debian13/**', '.github/workflows/build-debian13-niri.yml', 'scripts/niri/**', 'scripts/terminal/**']

permissions:
  contents: write

concurrency:
  group: debian13-niri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout Debian overlay fork
        uses: actions/checkout@v4
        with:
          path: fork
      - name: Checkout pinned upstream Debian 13 Droidspaces builder
        uses: actions/checkout@v4
        with:
          repository: Goldzxcbug/Droidspaces-rootfs-Desktop-builder
          ref: 24189f46b4608d312f654d9f53a48e25a214001c
          path: upstream
          persist-credentials: false
      - name: Check scripts and hardware architecture
        run: |
          uname -m
          test "$(uname -m)" = aarch64
          bash -n fork/debian13/scripts/*.sh
          bash fork/debian13/scripts/progress.sh stage 0 6 "starting builds"
          test -f upstream/Debian-13.Dockerfile
      - name: "[1/6] Debian 13 + Anland Niri base"

        run: |
          docker build --progress=plain --platform linux/arm64 \
            -f upstream/Debian-13.Dockerfile --target customizer \
            --build-arg USERNAME="${{ inputs.username || 'colle' }}" \
            --build-arg DESKTOP=niri \
            --build-arg DESKTOP_AUTOSTART=true \
            --build-arg DISPLAY_BACKEND=anland-wayland \
            --build-arg PulseAudio=none \
            --build-arg ENABLE_zh_tz_ARG=true \
            --build-arg ENABLE_binfmt_ARG=false \
            --build-arg ENABLE_yj_ARG=false \
            --build-arg ENABLE_mesa_ARG=true \
            --build-arg ENABLE_kfgj_ARG=false \
            --build-arg ENABLE_zip_ARG=true \
            --build-arg ENABLE_docker_ARG=false \
            --build-arg ENABLE_srf_ARG=true \
            --build-arg ENABLE_8gen2_wayland_ARG=false \
            --build-arg ENABLE_systemd257_ARG=false \
            -t droidspaces-debian13-niri:base upstream
          bash fork/debian13/scripts/progress.sh stage 1 6 "Debian 13 base ready"
      - name: "[2/6] Latest compatible Ghostty ARM64 .deb"
        run: |
          docker build --progress=plain --platform linux/arm64 \
            -f fork/debian13/Dockerfile --target ghostty-builder \
            --build-arg ENABLE_GHOSTTY="${{ github.event_name == 'push' && 'true' || (inputs.ghostty && 'true' || 'false') }}" \
            -t droidspaces-ghostty:builder fork
          bash fork/debian13/scripts/progress.sh stage 2 6 "Ghostty .deb selected and verified"
      - name: "[3/6] Reef ARM64 / Cargo source build"
        run: |
          docker build --progress=plain --platform linux/arm64 \
            -f fork/debian13/Dockerfile --target reef-builder \
            -t droidspaces-reef:builder fork
          bash fork/debian13/scripts/progress.sh stage 3 6 "Reef compiled"
      - name: "[4/6] Debian overlay + Niri config validation"
        run: |
          mkdir -p out/rootfs
          docker build --progress=plain --platform linux/arm64 \
            -f fork/debian13/Dockerfile --target customizer \
            --build-arg BASE_IMAGE=droidspaces-debian13-niri:base \
            --build-arg USERNAME="${{ inputs.username || 'colle' }}" \
            --build-arg ENABLE_GHOSTTY="${{ github.event_name == 'push' && 'true' || (inputs.ghostty && 'true' || 'false') }}" \
            --build-arg ENABLE_RIME="${{ github.event_name == 'push' && 'true' || (inputs.rime && 'true' || 'false') }}" \
            -t droidspaces-debian13-niri:final fork
          bash fork/debian13/scripts/progress.sh stage 4 6 "Desktop overlay validated"
      - name: "[5/6] Stream Docker rootfs through xz with byte progress"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq pv
          mkdir -p out
          # Reuse image produced in step 4, bypassing slow BuildKit local export.
          image=droidspaces-debian13-niri:final
          docker image inspect "$image" >/dev/null
          echo "[rootfs] Streaming flattened filesystem from $image"
          container_id="$(docker create "$image" /bin/true)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          bash fork/debian13/scripts/progress.sh run "Docker export + xz" 20 \
            bash -c 'set -euo pipefail; docker export "$1" | pv -f -i 10 -t -b -r -N "RootFS bytes" | xz -T2 -1 -c > "$2"' \
            _ "$container_id" "out/droidspaces-debian13-niri-arm64.tar.xz"
          test -s out/droidspaces-debian13-niri-arm64.tar.xz
          ls -lh out/droidspaces-debian13-niri-arm64.tar.xz
          sha256sum out/droidspaces-debian13-niri-arm64.tar.xz > out/SHA256SUMS
          cat out/SHA256SUMS
          bash fork/debian13/scripts/progress.sh stage 5 6 "RootFS exported and compressed"
      - name: "[6/6] Upload rootfs to Actions artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-debian13-niri-arm64
          path: |
            out/*.tar.xz
            out/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
      - name: Finish progress summary
        if: success()
        run: bash fork/debian13/scripts/progress.sh stage 6 6 "Artifact uploaded"
      - name: Create release on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debian13-niri-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.tar.xz out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Debian 13 Niri ARM64 ${GITHUB_RUN_NUMBER}" \
            --notes "Experimental Droidspaces Debian 13 ARM64 Niri + Noctalia. Test on Android 4.19 before daily use."
